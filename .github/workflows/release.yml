name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build .mcpb bundle
        # Invoke directly (not via `pnpm pack:mcpb`) so the pnpm script runner's
        # project deps-status check doesn't run; the build script only needs
        # node + pnpm on PATH and installs the bundle's deps in a temp dir.
        run: node scripts/build-mcpb.mjs
        env:
          # Repo variable: Settings → Secrets and variables → Actions → Variables.
          # Falls back to the manifest default when unset.
          ETRACKER_MCP_URL: ${{ vars.ETRACKER_MCP_URL }}

      # Every build (incl. main pushes) is downloadable from the Actions run.
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: etracker-mcp-mcpb
          path: dist-mcpb/*.mcpb
          if-no-files-found: error

      # Only tagged releases additionally get the bundle attached to a release.
      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-mcpb/*.mcpb
          generate_release_notes: true
